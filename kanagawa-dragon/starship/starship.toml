# ── OS & User ─────────────────────────────────────────────────────────────────

[os]
disabled = true

[username]
show_always = true
style_user  = "bold fg:color_orange"
style_root  = "bold fg:color_red"
format      = "[$user]($style):"

# ── Directory ─────────────────────────────────────────────────────────────────

[directory]
style             = "bold fg:color_yellow"
format            = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo  = true

# ── Git ───────────────────────────────────────────────────────────────────────

[git_branch]
symbol = " "
style  = "bold fg:color_aqua"
format = "[$symbol$branch]($style) "

[git_status]
style  = "bold fg:color_red"
format = "([$all_status$ahead_behind]($style) )"

[git_state]
style  = "bold fg:color_red"
format = "([$state($progress_current/$progress_total)]($style) )"

# ── Python ────────────────────────────────────────────────────────────────────

[python]
symbol            = "󰌠 "
style             = "fg:color_yellow"
format            = "[($symbol$virtualenv )]($style)"
detect_files      = []
detect_extensions = []
detect_folders    = []

# ── Time & Date ───────────────────────────────────────────────────────────────

[time]
disabled    = false
time_format = "%H:%M"
style       = "fg:color_bg3"
format      = "[$time]($style)"

# ── Misc ──────────────────────────────────────────────────────────────────────

[cmd_duration]
min_time = 2000
style    = "fg:color_yellow"
format   = "[󱦟 $duration]($style) "

[jobs]
symbol    = "󰒓 "
style     = "fg:color_purple"
format    = "[$symbol$number]($style) "
threshold = 1

[sudo]
disabled = true

[status]
disabled = false
symbol   = "✘ "
style    = "bold fg:color_red"
format   = "[$symbol$status]($style) "

# ── Battery (right prompt) ────────────────────────────────────────────────────

[battery]
disabled           = true
full_symbol        = "󰁹 "
charging_symbol    = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol     = "󰂑 "
empty_symbol       = "󰂎 "
format             = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 20
style     = "bold fg:color_red"

[[battery.display]]
threshold = 50
style     = "fg:color_yellow"

[[battery.display]]
threshold = 100
style     = "fg:color_green"

# ── Prompt character ──────────────────────────────────────────────────────────

[character]
success_symbol = "[>](bold fg:color_green) "
error_symbol   = "[>](bold fg:color_red) "
