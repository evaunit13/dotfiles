# Fonts
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window layout & dimensions
remember_window_size  no
initial_window_width  87c
initial_window_height 22c
window_padding_width  5 7
confirm_os_window_close 0
wayland_titlebar_color background

# Bell
enable_audio_bell no

# Scrollback & scroll indicator
scrollback_lines 10000
scrollback_indicator_opacity 0.0

# Mouse & URLs
copy_on_select clipboard
mouse_hide_wait -1.0
url_color #72a7bc
url_style curly

# Cursor
cursor_shape underline
cursor_shape_unfocused unchanged
cursor_underline_thickness 2.0
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #141312
active_tab_background #8a9a7b
inactive_tab_foreground #c5c9c5
inactive_tab_background #282727

# Colors (Kanagawa Dragon on Deep Charcoal)
background #141312
foreground #c5c9c5
cursor     #c8c093
cursor_text_color #141312
selection_background #2d4f67
selection_foreground #c5c9c5

# ANSI Colors (0-7 Normal)
color0 #0d0c0c
color1 #c4746e
color2 #8a9a7b
color3 #c4b28a
color4 #8ba4b0
color5 #a292a3
color6 #8ea4a2
color7 #c5c9c5

# ANSI Colors (8-15 Bright)
color8  #7a8382
color9  #e46876
color10 #87a987
color11 #e6c384
color12 #7fb4ca
color13 #b6927b
color14 #7aa89f
color15 #dcd7ba
